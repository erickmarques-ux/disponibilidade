<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disponibilidade — Tropa da Kangu</title>
<style>
  :root{ --void:#0b0f14; --panel:#141b23; --line:#243040; --ink:#e8edf3; --mute:#8b9bb0;
         --amber:#f97316; --ok:#22c55e; --alert:#ef4444; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--void);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;display:flex;justify-content:center}
  .wrap{width:100%;max-width:440px;padding:22px 16px 40px}
  h1{font-size:1.15rem;font-weight:800;letter-spacing:-.02em;margin:0 0 2px}
  h1 em{font-style:normal;color:var(--amber)}
  .sub{color:var(--mute);font-size:.8rem;margin-bottom:18px}
  label{display:block;font-size:.8rem;color:var(--mute);margin:14px 0 6px}
  input,select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:12px;font-size:1rem}
  input[type=text]{text-transform:uppercase;letter-spacing:.08em}
  button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--amber);
    color:#0b0f14;font-size:1rem;font-weight:800;cursor:pointer}
  button:disabled{opacity:.5}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
  .nome{font-size:1.1rem;font-weight:800}
  .aviso{border-left:3px solid var(--alert);background:rgba(239,68,68,.08);padding:12px;border-radius:8px;margin-top:14px;font-size:.9rem}
  .aviso.ok{border-left-color:var(--ok);background:rgba(34,197,94,.08)}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:.9rem;line-height:1.4}
  .check input{width:20px;height:20px;margin-top:1px}
  .msg{text-align:center;padding:40px 10px}
  .msg .big{font-size:2.4rem}
  .esconde{display:none}
  .erro{color:#fca5a5;font-size:.85rem;margin-top:8px;min-height:1em}
  .rod{color:#3d4a5c;font-size:.65rem;text-align:center;margin-top:26px;text-transform:uppercase;letter-spacing:.1em}
</style>
</head>
<body>
<div class="wrap">
  <h1>Disponibilidade <em>Tropa da Kangu</em></h1>
  <div class="sub" id="sub">Informe sua placa para começar.</div>

  <!-- PASSO 1: placa -->
  <div id="passoPlaca">
    <label>Placa do veículo</label>
    <input id="placa" type="text" maxlength="8" placeholder="ABC1D23" autocomplete="off">
    <div class="erro" id="erroPlaca"></div>
    <button id="btPlaca">Continuar</button>
  </div>

  <!-- PASSO 2: confirmação + disponibilidade -->
  <div id="passoDisp" class="esconde">
    <div class="card">
      <div class="nome" id="nomeMotorista">—</div>
      <div id="avisoStatus"></div>
      <div class="check esconde" id="boxInoperante">
        <input type="checkbox" id="ckInoperante">
        <span>Você está marcado como <b>inoperante</b>. Marque para <b>confirmar que está disponível</b> para retornar.</span>
      </div>
    </div>

    <div id="campos"></div>

    <button id="btEnviar" disabled>Enviar disponibilidade</button>
    <div class="erro" id="erroEnviar"></div>
  </div>

  <!-- PASSO 3: sucesso -->
  <div id="passoOk" class="esconde msg">
    <div class="big">✅</div>
    <p>Disponibilidade registrada!<br>Se você enviar de novo hoje, o novo envio substitui o anterior.</p>
  </div>

  <div class="rod">Tropa da Kangu</div>
</div>

<script>
/*** ======= CONFIG — PREENCHA ======= ***/
const CFG = {
  WORKER_URL: 'https://worker-kangu.erick-marques.workers.dev',
  // do formulário publicado (Enviar → link): .../forms/d/e/ISSO_AQUI/viewform
  FORM_RESPONSE_URL: 'https://docs.google.com/forms/d/e/COLE_O_ID_PUBLICADO/formResponse',
  ENTRY_MOTORISTA: 'entry.0000000000',   // ID do campo MOTORISTA (ver instruções)
  // Campos de disponibilidade — ajuste conforme as perguntas do seu form:
  CAMPOS: [
    { entry: 'entry.1111111111', label: 'Horário', tipo: 'select',
      opcoes: ['AM (8:00)', 'PM (13:00)', 'SD'] }
    // adicione mais objetos aqui se o form tiver mais perguntas
  ],
  HORA_ABRE: 21,
  HORA_FECHA: 18
};
const ST_BLOQUEIO = { CHURN: 'Cadastro em churn.', PAUSADO: 'Você está pausado.' };
const ST_INOPERANTE = 'INOPERANTE';
/*** ================================= ***/

let atual = null; // { nome, status }

function foraDoHorario() {
  const h = new Date().getHours();
  return !((h >= CFG.HORA_ABRE) || (h < CFG.HORA_FECHA));
}

document.getElementById('btPlaca').onclick = async function () {
  const placa = document.getElementById('placa').value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  const erro = document.getElementById('erroPlaca');
  erro.textContent = '';
  if (placa.length < 6) { erro.textContent = 'Digite a placa completa.'; return; }

  if (foraDoHorario()) {
    erro.textContent = 'Fora do horário: disponível das ' + CFG.HORA_ABRE + 'h às ' + CFG.HORA_FECHA + 'h.';
    return;
  }

  this.disabled = true; this.textContent = 'Verificando…';
  try {
    const r = await fetch(CFG.WORKER_URL + '/cadastro?placa=' + encodeURIComponent(placa));
    const j = await r.json();
    if (!j.found) { erro.textContent = 'Placa não encontrada no cadastro.'; return; }
    atual = j;
    mostrarDisponibilidade();
  } catch (e) {
    erro.textContent = 'Falha de conexão. Tente de novo.';
  } finally {
    this.disabled = false; this.textContent = 'Continuar';
  }
};

function mostrarDisponibilidade() {
  const st = String(atual.status || '').trim().toUpperCase();
  document.getElementById('nomeMotorista').textContent = atual.nome || '(sem nome)';
  const aviso = document.getElementById('avisoStatus');
  const boxIno = document.getElementById('boxInoperante');
  const bt = document.getElementById('btEnviar');

  // bloqueio (churn / pausado)
  if (ST_BLOQUEIO[st]) {
    aviso.className = 'aviso';
    aviso.innerHTML = '⛔ ' + ST_BLOQUEIO[st] + ' Não é possível enviar disponibilidade.';
    document.getElementById('campos').innerHTML = '';
    bt.classList.add('esconde');
    trocarPasso('passoDisp');
    return;
  }

  // inoperante -> exige confirmação do próprio motorista
  if (st === ST_INOPERANTE) {
    aviso.innerHTML = '';
    boxIno.classList.remove('esconde');
    document.getElementById('ckInoperante').onchange = function () {
      bt.disabled = !this.checked;
    };
  } else {
    aviso.className = 'aviso ok';
    aviso.textContent = 'Confirme que é você e informe sua disponibilidade.';
  }

  montarCampos();
  bt.classList.remove('esconde');
  bt.disabled = (st === ST_INOPERANTE); // libera só após confirmar
  trocarPasso('passoDisp');
}

function montarCampos() {
  const div = document.getElementById('campos');
  div.innerHTML = CFG.CAMPOS.map(function (c, i) {
    if (c.tipo === 'select') {
      return '<label>' + c.label + '</label><select id="c' + i + '">' +
        c.opcoes.map(o => '<option>' + o + '</option>').join('') + '</select>';
    }
    return '<label>' + c.label + '</label><input id="c' + i + '" type="text">';
  }).join('');
}

document.getElementById('btEnviar').onclick = function () {
  if (foraDoHorario()) { document.getElementById('erroEnviar').textContent = 'Fora do horário.'; return; }
  const dados = {};
  dados[CFG.ENTRY_MOTORISTA] = atual.nome;
  CFG.CAMPOS.forEach(function (c, i) { dados[c.entry] = document.getElementById('c' + i).value; });

  // envio ao Google Form via iframe oculto
  const sink = document.createElement('iframe'); sink.name = 'sink'; sink.style.display = 'none';
  document.body.appendChild(sink);
  const f = document.createElement('form');
  f.action = CFG.FORM_RESPONSE_URL; f.method = 'POST'; f.target = 'sink';
  Object.keys(dados).forEach(function (k) {
    const inp = document.createElement('input'); inp.type = 'hidden'; inp.name = k; inp.value = dados[k];
    f.appendChild(inp);
  });
  document.body.appendChild(f); f.submit();

  setTimeout(function () { trocarPasso('passoOk'); document.getElementById('sub').textContent = ''; }, 700);
};

function trocarPasso(id) {
  ['passoPlaca', 'passoDisp', 'passoOk'].forEach(p =>
    document.getElementById(p).classList.toggle('esconde', p !== id));
}
</script>
</body>
</html>
